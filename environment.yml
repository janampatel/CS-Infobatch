name: cs-infobatch
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pytorch>=2.6.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.1        # adjust to server CUDA version
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - matplotlib>=3.7.0
  - tqdm>=4.65.0
  - pyyaml>=6.0
  - pillow>=10.0.0
  - rasterio>=1.3.0          # conda-forge handles GDAL dependency cleanly
  - gdal>=3.6.0
  - pip:
    - transformers>=4.35.0
    - accelerate>=0.24.0
    # - wandb>=0.16.0         # uncomment for experiment tracking
